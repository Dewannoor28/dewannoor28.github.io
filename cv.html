<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f8fc">
  <title>CV Viewer — Dewan Nafiul Islam Noor</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#f7f8fc;color:#172033;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    .bar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border-bottom:1px solid rgba(55,73,105,.13);background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
    .title{min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .back{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:1px solid rgba(55,73,105,.16);border-radius:10px;color:#172033;text-decoration:none;font-size:.82rem;font-weight:600;background:#fff}
    .viewer{width:100%;height:100%;border:0;background:#eef3fb}
    @media(max-width:600px){.bar{height:54px;padding:0 12px}.title{font-size:.82rem}.back{min-height:36px;padding:7px 10px;font-size:.75rem}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="title">Dewan Nafiul Islam Noor — CV</div>
    <a class="back" href="index.html">← Back to portfolio</a>
  </header>
  <iframe
    class="viewer"
    title="Dewan Nafiul Islam Noor CV"
    src="assets/cv/Dewan_Nafiul_Islam_Noor_CV.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
    loading="eager">
  </iframe>
</body>
</html>
